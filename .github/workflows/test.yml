name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Test the impact-script helpers
        run: >
          uv run --no-project
          --with pytest --with numpy --with pandas --with microdf-python
          pytest scripts/tests -q
